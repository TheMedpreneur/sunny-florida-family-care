<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#B84A2E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sunny Florida" />

    <title>Sunny Florida Family Care | Bilingual Primary Care in Jacksonville, FL</title>
    <!--
      data-rh hands this tag to react-helmet-async. Without it Helmet cannot
      see the tag, so it appended its per-page description alongside this one
      and every route shipped two — this generic one first, which is the one a
      crawler reads. The per-page descriptions in SEO.jsx were correct all
      along; they were just sitting behind this.

      The tag stays rather than being deleted so a crawler that does not run JS
      still gets a description. Helmet replaces it as soon as React mounts.
    -->
    <meta
      data-rh="true"
      name="description"
      content="Private-pay primary care for families across Jacksonville. Unhurried visits with Ana Adamski, FNP-C — bilingual in English and Spanish. Telehealth, mobile visits, and transparent pricing."
    />

    <!-- Ana's logo as the icon, replacing the placeholder emoji favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/images/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/icon-192.png" />
    <link rel="apple-touch-icon" href="/images/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      FONT LOADING
      1. preconnect so DNS + TLS are done before the CSS is requested
      2. preload the stylesheet for early discovery
      3. load it with media="print" so it never blocks first paint, then swap
      4. <noscript> fallback

      Weights are trimmed to what the design actually uses: Newsreader roman +
      italic for headings, Hanken Grotesk roman for body, Caveat 400..600 for
      the two handwritten quotes. Sans italic is synthesized rather than
      downloaded.

      Caveat is a variable font, so widening 400 to 400..600 is the same single
      file — no extra request, no extra bytes of consequence. It buys the hero
      quote real weight instead of a synthesised fake bold, which is half of
      why "I'm here for you" was hard to read against the photo.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Hanken+Grotesk:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Hanken+Grotesk:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..600&family=Hanken+Grotesk:wght@400..700&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap"
      />
    </noscript>

    <!--
      Largest Contentful Paint is the hero portrait — fetch it with the HTML.

      imagesrcset/imagesizes must mirror the <picture> in Hero.jsx exactly. A
      plain href preload here would tell the browser to fetch the 1000px file
      while the markup then picked the 600px one, and phones would download
      both — a "performance" tag costing 53KB on the critical path.
    -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/ana-hero.webp"
      imagesrcset="/images/ana-hero-sm.webp 600w, /images/ana-hero.webp 1000w"
      imagesizes="(min-width: 1024px) 560px, (min-width: 640px) 448px, 100vw"
      fetchpriority="high"
    />

    <!--
      Structured data lives in src/components/SEO.jsx so it is generated from
      src/data/practice.js and can never disagree with the phone number and
      hours rendered on the page.
    -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:40rem;margin:4rem auto;padding:0 1.5rem;font-family:system-ui,sans-serif;color:#2B1F18">
        <h1>Sunny Florida Family Care</h1>
        <p>
          This site needs JavaScript to run. To book an appointment right now, visit
          <a href="https://calendly.com/ana-sunnyfloridafamilycare/30min">our booking page</a>
          or call the practice.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
