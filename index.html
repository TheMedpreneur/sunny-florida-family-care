    <!--
      FONT LOADING STRATEGY (Non-blocking, optimized):
      1. Preconnect to font origins early (DNS + TLS handshake)
      2. Preload the CSS as a high-priority style resource
      3. Load stylesheet with media="print" so it NEVER blocks render
      4. On load, swap to media="all" to apply fonts
      5. <noscript> fallback for no-JS browsers
      6. Reduced weight ranges to minimize download payload
    -->

    <!-- Step 1: Preconnect to Google Font servers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Step 2: Preload the font stylesheet for early discovery -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Hanken+Grotesk:ital,wght@0,400..700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap"
    />

    <!-- Step 3: Non-blocking stylesheet (media="print" prevents render-blocking) -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Hanken+Grotesk:ital,wght@0,400..700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <!-- Step 4: No-JS fallback -->
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Hanken+Grotesk:ital,wght@0,400..700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap"
      />
    </noscript>
